services:
  - type: web
    name: sequence-arasaac-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm install && npx turbo build --filter=api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Clau de l'HMAC amb què es pseudonimitzen les IP dels esdeveniments de
      # seguretat. La genera Render: no ha de sortir mai del servei, i canviar-la
      # invalida les correlacions anteriors (que és el comportament correcte).
      - key: IP_HASH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      # Remitent dels correus — ha de ser d'un domini verificat a Resend
      - key: MAIL_FROM
        sync: false
      # Base pública del frontend, per construir els enllaços de verificació.
      # Sense aquesta, el servidor es nega a arrencar en producció.
      - key: APP_PUBLIC_URL
        sync: false
      # Adreça on arriben els avisos d'errors que han arribat a un usuari.
      # Si es deixa buida no s'envia cap correu, però els errors es continuen
      # registrant i es veuen al panell d'administració.
      - key: ADMIN_ALERT_EMAIL
        sync: false
      # Interruptor de les funcions de compte. "true" és el comportament de
      # sempre; "false" tanca /api/auth, /api/documents, /api/user i /api/admin
      # amb un 503 sense treure'n el codi, i ha d'anar de bracet amb el
      # VITE_ACCOUNTS_ENABLED de la compilació del front.
      - key: ACCOUNTS_ENABLED
        value: "true"
